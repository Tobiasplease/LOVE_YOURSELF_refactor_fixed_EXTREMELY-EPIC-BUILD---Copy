<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prompt Panel</title>
<style>
  :root{
    --bg:#17151c; --panel:#1e1b24; --line:#2e2a37;
    --ink:#e8e4ee; --dim:#9d95ad; --faint:#6d6579;
    --sys:#7fb2ff; --usr:#7fe0b0; --out:#ffc98a; --warn:#ff8b8b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .stat{color:var(--dim);font-size:13px}
  header .stat b{color:var(--ink);font-weight:600}
  nav{margin-left:auto;display:flex;gap:6px}
  nav button{background:none;border:1px solid var(--line);color:var(--dim);
             padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.on{background:var(--panel);color:var(--ink);border-color:var(--faint)}

  .wrap{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 53px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
  .item{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .item:hover{background:#221f29}
  .item.on{background:var(--panel);border-left-color:var(--sys)}
  .item .t{font-size:14px}
  .item .m{font-size:12px;color:var(--faint);display:flex;gap:8px;margin-top:1px}
  .item.idle .t{color:var(--faint)}
  .item.undoc .t::after{content:" ⚠";color:var(--warn)}

  main{overflow-y:auto;padding:22px 26px 60px}
  h2{font-size:19px;margin:0 0 4px}
  .blurb{color:var(--dim);margin:0 0 16px;font-size:14px;max-width:70ch}
  .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--faint);font-size:12px;
        border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
  .block{margin-bottom:22px}
  .label{font-size:11px;letter-spacing:.9px;text-transform:uppercase;
         color:var(--faint);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .label i{width:8px;height:8px;border-radius:2px;display:inline-block;font-style:normal}
  .label.sys i{background:var(--sys)} .label.usr i{background:var(--usr)}
  .label.out i{background:var(--out)} .label.pre i{background:var(--faint)}
  pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:14px 16px;white-space:pre-wrap;word-break:break-word;
      font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-width:100ch}
  pre.out{border-color:#4a3f2d}
  .empty{color:var(--faint);font-style:italic}
  .ledger{max-width:80ch}
  .slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:14px 16px;margin-bottom:14px}
  .slot .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint)}
  .slot .v{font-size:15px;margin-top:4px}
  ol.hist{margin:6px 0 0;padding-left:22px;color:var(--dim);font-size:13.5px}
  ol.hist li{margin:3px 0}
  ol.hist li:last-child{color:var(--ink)}
  .gates{display:flex;flex-wrap:wrap;gap:8px}
  .gate{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:4px 12px;font-size:12.5px;color:var(--dim)}
  .gate b{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Prompt Panel</h1>
  <span class="stat" id="stats">reading…</span>
  <nav>
    <button id="tab-passes" class="on">Passes</button>
    <button id="tab-identity">Identity</button>
  </nav>
</header>

<div class="wrap">
  <aside id="list"></aside>
  <main id="view"></main>
</div>

<script>
const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let DATA = null, sel = "caption", tab = "passes";

function block(cls, label, text, cls2){
  if(!text) return "";
  return `<div class="block"><div class="label ${cls}"><i></i>${label}</div>`+
         `<pre class="${cls2||''}">${esc(text)}</pre></div>`;
}

function renderList(){
  const el = document.getElementById("list");
  if(tab === "identity"){ el.innerHTML = ""; return; }
  el.innerHTML = DATA.passes.map(p => {
    const on = p.key === sel ? " on" : "";
    const idle = p.count === 0 ? " idle" : "";
    const und = p.documented ? "" : " undoc";
    const right = p.count ? `${p.count}× · ${p.last_ago}` : "not this run";
    return `<div class="item${on}${idle}${und}" data-k="${p.key}">
              <div class="t">${esc(p.title)}</div>
              <div class="m"><span>${right}</span></div>
            </div>`;
  }).join("");
  el.querySelectorAll(".item").forEach(n =>
    n.onclick = () => { sel = n.dataset.k; render(); });
}

function renderPass(){
  const p = DATA.passes.find(x => x.key === sel) || DATA.passes[0];
  const v = document.getElementById("view");
  if(!p){ v.innerHTML = "<p class='empty'>Nothing yet.</p>"; return; }
  let h = `<h2>${esc(p.title)}</h2><p class="blurb">${esc(p.blurb)}</p>`;
  if(!p.call){
    v.innerHTML = h + `<p class="empty">This pass hasn't run in the current session.</p>`;
    return;
  }
  const c = p.call;
  const bits = [`<code>${esc(p.key)}</code>`, c.when, c.model].filter(Boolean);
  if(c.stream_mode) bits.push(`shape: ${esc(c.stream_mode)}`);
  if(c.history_len != null) bits.push(`${c.history_len} prior thoughts`);
  if(c.frames) bits.push(`${c.frames} frames`);
  if(!c.ok) bits.push(`<span style="color:var(--warn)">call failed</span>`);
  h += `<div class="meta">${bits.map(b=>`<span>${b}</span>`).join("")}</div>`;
  h += block("sys","What it was told it is", c.system);
  h += block("usr","What the world said", c.user);
  h += block("pre","Its own unfinished thought (the seam)", c.prefill);
  h += block("out","What it said", c.output, "out");
  v.innerHTML = h;
}

function renderIdentity(){
  const id = DATA.identity, v = document.getElementById("view");
  if(!id){ v.innerHTML = "<p class='empty'>No identity file yet.</p>"; return; }
  const slot = (k,val) => `<div class="slot"><div class="k">${k}</div>
      <div class="v">${val ? esc(val) : "<span class='empty'>empty</span>"}</div></div>`;
  const hist = (k,arr) => !arr.length ? "" :
    `<div class="slot"><div class="k">${k} — oldest to newest</div>
      <ol class="hist">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
  v.innerHTML = `<h2>Identity</h2>
    <p class="blurb">What the machine currently believes about itself. These lines
    are written by the reflection loop and read back into every prompt — the class
    of text that has caused every spiral, so it is worth watching them move.</p>
    <div class="ledger">
      ${slot("Persona — in every call", id.persona)}
      ${slot("Wants", id.desire)}
      ${slot("Believes", id.belief)}
      ${hist("How the wanting has changed", id.desires)}
      ${hist("How the believing has changed", id.beliefs)}
      ${hist("Notes it has made about itself", id.self_notes)}
      ${hist("Things it says happened", id.events)}
    </div>`;
}

function render(){
  document.getElementById("tab-passes").className = tab==="passes" ? "on":"";
  document.getElementById("tab-identity").className = tab==="identity" ? "on":"";
  document.querySelector(".wrap").style.gridTemplateColumns = tab==="identity" ? "0 1fr" : "290px 1fr";
  const t = DATA.totals;
  document.getElementById("stats").innerHTML =
    `run <b>${esc(DATA.run||"—")}</b> · <b>${t.calls}</b> calls · <b>${t.captions}</b> thoughts kept `+
    `· <b>${t.pass_rate}%</b> survived the gates`;
  renderList();
  tab === "identity" ? renderIdentity() : renderPass();
}

async function load(){
  const r = await fetch("/api/data");
  DATA = await r.json();
  if(DATA.error){ document.getElementById("view").innerHTML =
      `<pre style="color:var(--warn)">${esc(DATA.error)}</pre>`; return; }
  render();
}
document.getElementById("tab-passes").onclick = () => { tab="passes"; render(); };
document.getElementById("tab-identity").onclick = () => { tab="identity"; render(); };
load();
setInterval(load, 5000);
</script>
</body>
</html>
